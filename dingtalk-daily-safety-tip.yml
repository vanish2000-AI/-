name: DingTalk daily safety tip

on:
  # GitHub Actions cron uses UTC. 23:00 UTC = 07:00 Asia/Shanghai.
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      DINGTALK_CONFIG_PATH: dingtalk/config.json
      DINGTALK_IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Send DingTalk message
        run: python dingtalk/send_dingtalk_safety_tip.py
